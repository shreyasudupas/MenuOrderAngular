<div class="layout-container">
  <div class="layout-image-menu-container">
      <div class="app-image-container">
        <img src="assets/Logo/MenuLogo1.png" alt="MenuLogo" class="Logo" />
      </div>
      <app-menu-bar></app-menu-bar>
  </div>

  <div class="layout-content">
      <div class="layout-container">
        <!--1st Row-->
        <div class="col-12">
          <div class="header-layout">
            <div class="menu-button">
              <div class="col-2">
                <p-button icon="pi pi-bars" styleClass="p-button-raised p-button-text" (click)="displaySideMenuBar()"></p-button>
              </div>
            </div>

            <div class="space-between"></div>

            <div class="tools-container">
              <div class="col-12">
                <div class="tools-options">
                  <notification></notification>
                </div>
              </div>
            </div>

          </div>
        </div>

        <!--2nd Row-->
        <div class="col-12">
          <router-outlet></router-outlet>
        </div>
      </div>

      <p-sidebar [(visible)]="sidebarVisible">
        <h3>Menu Admin Application</h3>
        <app-menu-bar></app-menu-bar>
      </p-sidebar>
  </div>
</div>
